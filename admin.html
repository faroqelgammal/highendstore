<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم — High End Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d0d;color:#fff;min-height:100vh}
:root{--gold:#c9a84c;--dark:#0d0d0d;--dark2:#141414;--dark3:#1a1a1a}

header{background:var(--dark2);border-bottom:0.5px solid rgba(201,168,76,.2);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:3px}
.logo span{color:rgba(255,255,255,.4);font-size:10px;letter-spacing:1px;margin-right:12px;font-weight:400}
.back-btn{font-size:11px;color:rgba(255,255,255,.35);text-decoration:none;border:0.5px solid rgba(201,168,76,.2);padding:6px 14px;letter-spacing:.5px;transition:all .2s}
.back-btn:hover{border-color:var(--gold);color:var(--gold)}

.container{max-width:960px;margin:0 auto;padding:28px}

.panel{background:var(--dark2);border:0.5px solid rgba(201,168,76,.15);padding:24px;margin-bottom:24px}
.panel-title{font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:20px;padding-bottom:12px;border-bottom:0.5px solid rgba(201,168,76,.1)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.5px}
input,select,textarea{background:var(--dark3);border:0.5px solid rgba(201,168,76,.2);color:#fff;padding:10px 12px;font-size:13px;font-family:inherit;outline:none;transition:border-color .2s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
select option{background:var(--dark3)}
textarea{resize:vertical;min-height:70px}

.img-preview{margin-top:8px;width:100%;height:120px;background:var(--dark3);border:0.5px dashed rgba(201,168,76,.2);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:12px;overflow:hidden}
.img-preview img{width:100%;height:100%;object-fit:cover}

.add-btn{background:var(--gold);color:var(--dark);border:none;padding:12px 28px;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:8px;transition:opacity .2s;width:100%}
.add-btn:hover{opacity:.9}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat{background:var(--dark2);border:0.5px solid rgba(201,168,76,.15);padding:16px;text-align:center}
.stat-num{font-size:24px;color:var(--gold);font-weight:700;margin-bottom:4px}
.stat-label{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:1px}

.products-table{width:100%;border-collapse:collapse}
.products-table th{font-size:9px;color:var(--gold);letter-spacing:2px;padding:8px 12px;border-bottom:0.5px solid rgba(201,168,76,.15);text-align:right;font-weight:500}
.products-table td{font-size:12px;color:rgba(255,255,255,.65);padding:10px 12px;border-bottom:0.5px solid rgba(255,255,255,.05);vertical-align:middle}
.products-table tr:hover td{background:rgba(201,168,76,.03)}
.prod-thumb{width:40px;height:40px;background:var(--dark3);border:0.5px solid rgba(201,168,76,.1);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px}
.prod-thumb img{width:100%;height:100%;object-fit:cover}
.del-btn{background:none;border:0.5px solid rgba(231,76,60,.3);color:rgba(231,76,60,.6);padding:4px 10px;font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:.5px}
.del-btn:hover{border-color:#e74c3c;color:#e74c3c}
.edit-btn{background:none;border:0.5px solid rgba(201,168,76,.3);color:rgba(201,168,76,.6);padding:4px 10px;font-size:10px;cursor:pointer;transition:all .2s;letter-spacing:.5px;margin-left:6px}
.edit-btn:hover{border-color:var(--gold);color:var(--gold)}
.empty-row td{text-align:center;padding:28px;color:rgba(255,255,255,.15);font-size:12px}

.badge{font-size:8px;padding:2px 8px;letter-spacing:.5px;font-weight:500}
.badge-sale{background:rgba(201,168,76,.15);color:var(--gold);border:0.5px solid rgba(201,168,76,.3)}
.badge-normal{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);border:0.5px solid rgba(255,255,255,.1)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dark);padding:10px 24px;font-size:12px;font-weight:700;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

.clear-btn{background:none;border:0.5px solid rgba(231,76,60,.2);color:rgba(231,76,60,.4);padding:6px 14px;font-size:10px;cursor:pointer;letter-spacing:.5px;transition:all .2s}
.clear-btn:hover{border-color:#e74c3c;color:#e74c3c}
</style>
</head>
<body>

<header>
  <div class="logo">HIGH END <span>لوحة التحكم</span></div>
  <a href="index.html" class="back-btn">← المتجر</a>
</header>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">إجمالي المنتجات</div></div>
    <div class="stat"><div class="stat-num" id="statCats">0</div><div class="stat-label">الفئات النشطة</div></div>
    <div class="stat"><div class="stat-num" id="statSale">0</div><div class="stat-label">منتجات بخصم</div></div>
  </div>

  <div class="panel">
    <div class="panel-title">إضافة / تعديل منتج</div>
    <input type="hidden" id="editId">
    <div class="form-grid">
      <div class="form-group">
        <label>اسم المنتج *</label>
        <input type="text" id="fName" placeholder="مثال: Casio Edifice Chronograph">
      </div>
      <div class="form-group">
        <label>الفئة *</label>
        <select id="fCat">
          <option value="">اختر الفئة</option>
          <option>ساعات رجالي</option>
          <option>ساعات نسائي</option>
          <option>ساعات فاخرة</option>
          <option>محافظ</option>
          <option>حقائب</option>
          <option>نظارات</option>
          <option>عطور</option>
          <option>أحزمة</option>
          <option>حافظات كروت</option>
          <option>هدايا</option>
        </select>
      </div>
      <div class="form-group">
        <label>السعر الحالي (LE) *</label>
        <input type="number" id="fPrice" placeholder="1599">
      </div>
      <div class="form-group">
        <label>السعر القديم (اتركه فارغ لو مفيش خصم)</label>
        <input type="number" id="fOldPrice" placeholder="2000">
      </div>
      <div class="form-group full">
        <label>مسار الصورة (ارفع الصورة في GitHub في فولدر images/ ثم اكتب المسار)</label>
        <input type="text" id="fImg" placeholder="images/watch1.jpg" oninput="previewImg()">
        <div class="img-preview" id="imgPreview">معاينة الصورة هنا</div>
      </div>
      <div class="form-group full">
        <label>وصف المنتج (اختياري)</label>
        <textarea id="fDesc" placeholder="وصف مختصر للمنتج..."></textarea>
      </div>
    </div>
    <button class="add-btn" id="submitBtn" onclick="submitProduct()">إضافة المنتج</button>
  </div>

  <div class="panel">
    <div class="panel-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>المنتجات الحالية</span>
      <button class="clear-btn" onclick="clearAll()">حذف الكل</button>
    </div>
    <table class="products-table">
      <thead>
        <tr>
          <th>الصورة</th>
          <th>الاسم</th>
          <th>الفئة</th>
          <th>السعر</th>
          <th>الحالة</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="prodTable"></tbody>
    </table>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let products = JSON.parse(localStorage.getItem('he_products') || '[]');

function save(){ localStorage.setItem('he_products', JSON.stringify(products)); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function previewImg(){
  const src = document.getElementById('fImg').value.trim();
  const el = document.getElementById('imgPreview');
  el.innerHTML = src ? `<img src="${src}" alt="preview" onerror="this.parentElement.innerHTML='الصورة غير موجودة — تأكد من المسار'">` : 'معاينة الصورة هنا';
}

function submitProduct(){
  const id = document.getElementById('editId').value;
  const name = document.getElementById('fName').value.trim();
  const cat = document.getElementById('fCat').value;
  const price = parseFloat(document.getElementById('fPrice').value);
  const oldPrice = document.getElementById('fOldPrice').value ? parseFloat(document.getElementById('fOldPrice').value) : null;
  const img = document.getElementById('fImg').value.trim();
  const desc = document.getElementById('fDesc').value.trim();

  if(!name || !cat || !price){ toast('⚠️ اسم المنتج والفئة والسعر مطلوبين'); return; }

  if(id){
    const idx = products.findIndex(p=>p.id===parseInt(id));
    if(idx>-1) products[idx] = {id:parseInt(id), name, cat, price, oldPrice, img, desc};
    document.getElementById('editId').value = '';
    document.getElementById('submitBtn').textContent = 'إضافة المنتج';
    toast('✅ تم تعديل المنتج');
  } else {
    const newId = Date.now();
    products.push({id:newId, name, cat, price, oldPrice, img, desc});
    toast('✅ تم إضافة المنتج');
  }

  save();
  clearForm();
  buildTable();
  buildStats();
}

function clearForm(){
  document.getElementById('fName').value='';
  document.getElementById('fCat').value='';
  document.getElementById('fPrice').value='';
  document.getElementById('fOldPrice').value='';
  document.getElementById('fImg').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('imgPreview').innerHTML='معاينة الصورة هنا';
}

function editProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('editId').value = id;
  document.getElementById('fName').value = p.name;
  document.getElementById('fCat').value = p.cat;
  document.getElementById('fPrice').value = p.price;
  document.getElementById('fOldPrice').value = p.oldPrice || '';
  document.getElementById('fImg').value = p.img || '';
  document.getElementById('fDesc').value = p.desc || '';
  document.getElementById('submitBtn').textContent = 'حفظ التعديلات';
  previewImg();
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteProduct(id){
  if(!confirm('هتحذف المنتج ده؟')) return;
  products = products.filter(p=>p.id!==id);
  save();
  buildTable();
  buildStats();
  toast('🗑 تم حذف المنتج');
}

function clearAll(){
  if(!confirm('هتحذف كل المنتجات؟ مفيش رجعة!')) return;
  products = [];
  save();
  buildTable();
  buildStats();
  toast('🗑 تم مسح جميع المنتجات');
}

function buildStats(){
  document.getElementById('statTotal').textContent = products.length;
  document.getElementById('statCats').textContent = new Set(products.map(p=>p.cat)).size;
  document.getElementById('statSale').textContent = products.filter(p=>p.oldPrice).length;
}

function buildTable(){
  const tbody = document.getElementById('prodTable');
  if(!products.length){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">لا توجد منتجات بعد — أضف أول منتج من الأعلى</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p=>`
    <tr>
      <td>
        <div class="prod-thumb">
          ${p.img ? `<img src="${p.img}" alt="${p.name}" onerror="this.parentElement.textContent='?'">` : '🏷'}
        </div>
      </td>
      <td>${p.name}</td>
      <td>${p.cat}</td>
      <td>
        ${p.oldPrice ? `<span style="text-decoration:line-through;color:rgba(255,255,255,.25);font-size:10px">LE ${Number(p.oldPrice).toLocaleString()}</span><br>` : ''}
        <span style="color:var(--gold);font-weight:600">LE ${Number(p.price).toLocaleString()}</span>
      </td>
      <td><span class="badge ${p.oldPrice?'badge-sale':'badge-normal'}">${p.oldPrice?'SALE':'عادي'}</span></td>
      <td>
        <button class="edit-btn" onclick="editProduct(${p.id})">تعديل</button>
        <button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button>
      </td>
    </tr>`).join('');
}

buildTable();
buildStats();
</script>
</body>
</html>
