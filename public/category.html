<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High End | الفئة</title>
    <meta name="description" content="تصفح منتجات High End حسب الفئة والماركة والسعر.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Tajawal:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                colors: {
                    gold: { DEFAULT: '#d4af37', light: '#f3e5ab', dark: '#aa8c2c', muted: '#4a3b22' },
                    dark: { bg: '#050505', card: '#0a0a0a', border: 'rgba(212,175,55,0.15)' }
                },
                fontFamily: {
                    arabic: ['Tajawal', 'sans-serif'], serif: ['Playfair Display', 'serif'],
                    cinzel: ['Cinzel', 'serif'], inter: ['Inter', 'sans-serif'],
                }
            }}
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="antialiased flex flex-col min-h-screen">

    <div id="top-bar-container"></div>
    <div id="navbar-container"></div>

    <main class="flex-grow py-10 bg-[#050505] min-h-[80vh]">
        <div class="container mx-auto w-[90%] max-w-[1400px]">

            <a href="index.html" class="mb-8 inline-flex items-center gap-2 text-gold hover:text-white transition-colors font-arabic">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </a>

            <div class="flex flex-col lg:flex-row gap-8 items-start">

                <!-- الشريط الجانبي للفلاتر -->
                <aside class="w-full lg:w-64 flex-shrink-0 bg-[#0a0a0a] border border-[rgba(212,175,55,0.12)] rounded-2xl p-6 lg:sticky lg:top-24">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-gold font-cinzel tracking-widest text-sm">FILTERS</h3>
                        <button onclick="resetCatFilters()" class="text-xs text-white/30 hover:text-gold transition-colors font-arabic">إعادة ضبط</button>
                    </div>

                    <!-- النوع -->
                    <div class="mb-6 border-b border-[rgba(212,175,55,0.08)] pb-5">
                        <h4 class="text-white text-xs font-arabic font-bold mb-3 tracking-widest uppercase">النوع</h4>
                        <div class="flex flex-col gap-2">
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-gender" value="" onchange="applyCatFilters()" class="accent-[#d4af37]" checked><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">الكل</span></label>
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-gender" value="men" onchange="applyCatFilters()" class="accent-[#d4af37]"><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">رجالي</span></label>
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-gender" value="women" onchange="applyCatFilters()" class="accent-[#d4af37]"><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">حريمي</span></label>
                        </div>
                    </div>

                    <!-- المادة -->
                    <div class="mb-6 border-b border-[rgba(212,175,55,0.08)] pb-5">
                        <h4 class="text-white text-xs font-arabic font-bold mb-3 tracking-widest uppercase">المادة</h4>
                        <div class="flex flex-col gap-2">
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-type" value="" onchange="applyCatFilters()" class="accent-[#d4af37]" checked><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">الكل</span></label>
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-type" value="rubber" onchange="applyCatFilters()" class="accent-[#d4af37]"><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">Rubber</span></label>
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-type" value="leather" onchange="applyCatFilters()" class="accent-[#d4af37]"><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">Leather</span></label>
                            <label class="flex items-center gap-3 cursor-pointer group"><input type="radio" name="sf-type" value="metal" onchange="applyCatFilters()" class="accent-[#d4af37]"><span class="text-white/70 text-sm font-arabic group-hover:text-gold transition-colors">Metal</span></label>
                        </div>
                    </div>

                    <!-- الماركة (تُبنى ديناميكياً) -->
                    <div class="mb-6 border-b border-[rgba(212,175,55,0.08)] pb-5">
                        <h4 class="text-white text-xs font-arabic font-bold mb-3 tracking-widest uppercase">الماركة</h4>
                        <div id="sf-brands-list" class="flex flex-col gap-2 max-h-40 overflow-y-auto pr-1"></div>
                    </div>

                    <!-- السعر -->
                    <div>
                        <h4 class="text-white text-xs font-arabic font-bold mb-3 tracking-widest uppercase">السعر (EGP)</h4>
                        <div class="flex gap-2 items-center">
                            <input type="number" id="sf-min-price" placeholder="من" onchange="applyCatFilters()" class="w-full bg-[#121212] border border-[rgba(212,175,55,0.2)] text-white p-2 rounded text-xs focus:border-gold outline-none font-inter" min="0">
                            <span class="text-white/30 text-xs">—</span>
                            <input type="number" id="sf-max-price" placeholder="إلى" onchange="applyCatFilters()" class="w-full bg-[#121212] border border-[rgba(212,175,55,0.2)] text-white p-2 rounded text-xs focus:border-gold outline-none font-inter" min="0">
                        </div>
                    </div>
                </aside>

                <!-- شبكة المنتجات -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between mb-6">
                        <h1 id="category-title" class="text-white font-arabic text-xl"></h1>
                        <span id="category-count" class="text-white/40 text-sm font-arabic"></span>
                    </div>
                    <div id="category-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <a class="fixed bottom-8 right-8 w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center text-white text-3xl z-50 whatsapp-float hover:scale-110 transition-transform duration-300" href="https://wa.me/201555823657" target="_blank" aria-label="تواصل عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <div id="cart-container"></div>

    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products-render.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
