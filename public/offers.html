<!DOCTYPE html>

        tailwind.config = {
            theme: { extend: {
                colors: {
                    gold: { DEFAULT: '#d4af37', light: '#f3e5ab', dark: '#aa8c2c', muted: '#4a3b22' },

<body class="antialiased flex flex-col min-h-screen">

            <div class="container mx-auto w-[90%] max-w-[1400px] relative py-16 md:py-20 text-center">

                <h1 class="text-white font-serif text-3xl md:text-5xl mb-4 text-balance">عروض حصرية لفترة محدودة</h1>
                <p class="text-white/50 font-arabic text-base md:text-lg max-w-2xl mx-auto leading-relaxed text-pretty">
                    اكتشف أرقى القطع الفاخرة بأسعار استثنائية — مجموعة مختارة بعناية من الساعات والعطور والإكسسوارات.

                <!-- شبكة منتجات العروض -->
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-white font-arabic text-xl md:text-2xl">كل العروض</h2>
                    <span id="offers-count" class="text-white/40 text-sm font-arabic"></span>
                </div>
                <div id="offers-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>

            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <a class="fixed bottom-8 right-8 w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center text-white text-3xl z-50 whatsapp-float hover:scale-110 transition-transform duration-300" href="https://wa.me/201555823657" target="_blank" aria-label="تواصل عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>

    <div id="cart-container"></div>

    <script src="js/products.js"></script>
