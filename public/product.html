<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High End | تفاصيل المنتج</title>
    <meta name="description" content="تفاصيل المنتج - High End متجر المنتجات الفاخرة.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Tajawal:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#d4af37', light: '#f3e5ab', dark: '#aa8c2c', muted: '#4a3b22' },
                        dark: { bg: '#050505', card: '#0a0a0a', border: 'rgba(212,175,55,0.15)' }
                    },
                    fontFamily: {
                        arabic: ['Tajawal', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        cinzel: ['Cinzel', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="antialiased flex flex-col min-h-screen">

    <div id="top-bar-container"></div>
    <div id="navbar-container"></div>

    <main class="flex-grow pt-8 pb-16">
        <div id="product-page" class="container mx-auto w-[90%] max-w-[1300px]">

            <!-- مسار التنقل -->
            <nav class="flex text-sm text-white/50 font-arabic mb-10" aria-label="Breadcrumb">
                <ol class="inline-flex items-center space-x-1 md:space-x-3 rtl:space-x-reverse">
                    <li class="inline-flex items-center"><a href="index.html" class="hover:text-gold transition-colors">الرئيسية</a></li>
                    <li><div class="flex items-center"><i class="fa-solid fa-chevron-left text-[10px] mx-2"></i><a id="breadcrumb-category" href="#" class="hover:text-gold transition-colors">الفئة</a></div></li>
                    <li><div class="flex items-center"><i class="fa-solid fa-chevron-left text-[10px] mx-2"></i><span id="breadcrumb-gender" class="text-white/50"></span></div></li>
                    <li aria-current="page"><div class="flex items-center"><i class="fa-solid fa-chevron-left text-[10px] mx-2"></i><span id="breadcrumb-name" class="text-gold">المنتج</span></div></li>
                </ol>
            </nav>

            <div class="flex flex-col lg:flex-row gap-12 lg:gap-16 items-start relative">

                <!-- معلومات المنتج -->
                <div class="w-full lg:w-[45%] flex flex-col pt-2 order-2 lg:order-1">

                    <div class="mb-3">
                        <a id="product-brand" href="#" class="text-gold tracking-[0.25em] text-xs font-cinzel uppercase font-semibold hover:text-white transition-colors inline-flex items-center gap-2">
                            <span id="product-brand-text"></span>
                            <i class="fa-solid fa-arrow-left text-[10px]"></i>
                        </a>
                    </div>

                    <h1 id="product-name" class="text-3xl lg:text-4xl text-white font-serif mb-6 leading-tight"></h1>

                    <div class="flex items-end flex-wrap gap-x-4 gap-y-2 mb-8">
                        <span id="product-price" class="text-gold font-bold text-3xl font-inter tracking-wide"></span>
                        <span id="product-old-price" class="text-white/30 line-through text-lg font-inter mb-1"></span>
                        <span id="product-discount" class="hidden bg-[#4a3b22] text-gold text-xs font-bold px-3 py-1 rounded-full mb-1 font-arabic"></span>
                    </div>

                    <p id="product-description" class="text-white/70 font-arabic text-base leading-relaxed mb-8"></p>

                    <!-- الألوان -->
                    <div class="mb-8">
                        <h4 class="text-white text-sm font-arabic font-bold mb-4">اللون المتوفر: <span id="color-name" class="text-gold font-normal mr-1"></span></h4>
                        <div id="product-colors" class="flex flex-wrap gap-3"></div>
                    </div>

                    <!-- الكمية والإجراءات -->
                    <div class="bg-[#0a0a0a] border border-[rgba(212,175,55,0.15)] rounded-2xl p-6 mb-8">
                        <div class="flex flex-col sm:flex-row items-center gap-4 mb-6">
                            <div class="w-full sm:w-1/3 flex items-center justify-between bg-[#121212] border border-white/10 rounded-lg px-4 h-14">
                                <button onclick="productDecreaseQuantity()" class="text-white/50 hover:text-gold text-lg transition-colors" aria-label="إنقاص"><i class="fa-solid fa-minus"></i></button>
                                <input type="number" id="qty-input" value="1" min="1" class="bg-transparent text-white text-center font-inter w-12 outline-none text-lg font-medium" readonly>
                                <button onclick="productIncreaseQuantity()" class="text-white/50 hover:text-gold text-lg transition-colors" aria-label="زيادة"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <button id="add-to-cart-btn" class="w-full sm:w-2/3 bg-gold hover:bg-[#b5952f] text-black h-14 text-center font-bold text-lg transition-all duration-300 rounded-lg font-arabic flex items-center justify-center gap-3">
                                <i class="fa-solid fa-cart-plus"></i> أضف إلى السلة
                            </button>
                        </div>
                        <a id="whatsapp-order-btn" href="https://wa.me/201555823657" target="_blank" class="w-full border border-[rgba(212,175,55,0.3)] bg-transparent text-white hover:border-gold hover:text-gold h-14 text-center font-bold text-lg transition-all duration-300 rounded-lg font-arabic flex items-center justify-center gap-3 group">
                            اطلب عبر واتساب <i class="fa-brands fa-whatsapp text-2xl text-[#25D366] group-hover:scale-110 transition-transform"></i>
                        </a>
                    </div>

                    <!-- شارات الثقة -->
                    <div class="flex items-center justify-start border-y border-white/5 py-4 mb-10 gap-8">
                        <div class="flex items-center gap-2"><i class="fa-solid fa-check text-gold text-sm"></i><span class="text-white/70 text-xs font-arabic font-medium">ضمان 14 يوم</span></div>
                        <div class="flex items-center gap-2"><i class="fa-solid fa-check text-gold text-sm"></i><span class="text-white/70 text-xs font-arabic font-medium">تغليف فاخر</span></div>
                        <div class="flex items-center gap-2"><i class="fa-solid fa-check text-gold text-sm"></i><span class="text-white/70 text-xs font-arabic font-medium">شحن سريع</span></div>
                    </div>

                    <!-- الأكورديونات -->
                    <div class="border-t border-[rgba(212,175,55,0.2)]">
                        <div class="border-b border-white/10">
                            <button onclick="toggleAccordion('acc-desc', this)" class="w-full py-5 flex justify-between items-center text-white text-sm md:text-base tracking-widest font-bold hover:text-gold transition-colors group">
                                <span class="font-arabic">الوصف</span>
                                <i class="fa-solid fa-plus text-sm text-gold transition-transform duration-300"></i>
                            </button>
                            <div id="acc-desc" class="accordion-content">
                                <div id="product-full-description" class="pb-6 text-white/70 font-arabic text-base leading-8"></div>
                            </div>
                        </div>

                        <div class="border-b border-white/10">
                            <button onclick="toggleAccordion('acc-features', this)" class="w-full py-5 flex justify-between items-center text-white text-sm md:text-base tracking-widest font-bold hover:text-gold transition-colors group">
                                <span class="font-arabic">المميزات</span>
                                <i class="fa-solid fa-plus text-sm text-gold transition-transform duration-300"></i>
                            </button>
                            <div id="acc-features" class="accordion-content">
                                <div class="pb-6 pt-2"><div id="product-features" class="flex flex-wrap gap-3"></div></div>
                            </div>
                        </div>

                        <div class="border-b border-white/10">
                            <button onclick="toggleAccordion('acc-tech', this)" class="w-full py-5 flex justify-between items-center text-white text-sm md:text-base tracking-widest font-bold hover:text-gold transition-colors group">
                                <span class="font-arabic">المواصفات</span>
                                <i class="fa-solid fa-plus text-sm text-gold transition-transform duration-300"></i>
                            </button>
                            <div id="acc-tech" class="accordion-content">
                                <div id="product-specifications" class="pb-6 pt-2"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- معرض الصور -->
                <div class="w-full lg:w-[55%] order-1 lg:order-2 lg:sticky lg:top-24">
                    <div class="w-full aspect-[4/5] bg-[#050505] flex items-center justify-center img-zoom-container p-4 mb-4">
                        <img id="main-product-image" src="" alt="صورة المنتج" class="w-full h-full object-contain mix-blend-lighten opacity-95">
                    </div>
                    <div id="product-thumbnails" class="flex gap-3 flex-wrap"></div>
                </div>
            </div>

            <!-- منتجات ذات صلة -->
            <div class="mt-24 border-t border-[rgba(212,175,55,0.1)] pt-16">
                <div class="section-title">
                    <h3 class="font-arabic text-2xl md:text-3xl text-white font-bold">قد يعجبك أيضاً</h3>
                </div>
                <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-5 md:gap-6"></div>
            </div>

        </div>
    </main>

    <div id="footer-container"></div>

    <a class="fixed bottom-8 right-8 w-16 h-16 bg-[#25D366] rounded-full flex items-center justify-center text-white text-3xl z-50 whatsapp-float hover:scale-110 transition-transform duration-300" href="https://wa.me/201555823657" target="_blank" aria-label="تواصل عبر واتساب">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <div id="cart-container"></div>

    <!-- ترتيب السكربتات: البيانات ثم الأدوات ثم منطق الصفحة -->
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script src="js/slider.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/products-render.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/product.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
