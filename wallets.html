<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High End | المحافظ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen bg-[#050505]">
    <div id="app-header"></div>
    <main class="flex-grow py-12 container mx-auto w-[90%] flex flex-col md:flex-row gap-8">
        <aside class="w-full md:w-64 bg-[#0a0a0a] border border-white/10 rounded-xl p-5 h-fit sticky top-24">
            <h3 class="text-gold font-bold mb-4 border-b border-white/5 pb-2">فلاتر البحث</h3>
            <div class="mb-4">
                <h4 class="text-sm text-gray-400 mb-2">النوع</h4>
                <label class="block text-white text-sm mb-1"><input type="radio" name="gender" class="ml-2"> رجالي</label>
                <label class="block text-white text-sm"><input type="radio" name="gender" class="ml-2"> نسائي</label>
            </div>
        </aside>
        <div class="flex-1">
            <h1 class="text-3xl text-white mb-6 border-b border-white/10 pb-4">المحافظ الفاخرة</h1>
            <div id="category-products" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>
        </div>
    </main>
    <div id="app-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadGlobalLayout();
            const grid = document.getElementById('category-products');
            const filtered = products.filter(p => p.category === 'Wallets');
            grid.innerHTML = filtered.length ? filtered.map(buildProductCard).join('') : '<p class="text-gray-500">لا توجد منتجات حالياً.</p>';
        });
    </script>
</body>
</html>
