<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High End | الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen">
    <div id="app-header"></div>
    <main class="flex-grow">
        <section class="h-[60vh] bg-[#050505] flex items-center justify-center relative border-b border-gold/20">
            <div class="text-center z-10">
                <h2 class="text-5xl text-white font-cinzel mb-4">Timeless Luxury</h2>
                <a href="watches.html" class="inline-block mt-4 px-8 py-3 bg-gold text-black rounded font-bold">تسوق الساعات الآن</a>
            </div>
        </section>
        <section class="py-16 bg-[#050505]">
            <div class="container mx-auto w-[90%]">
                <div class="section-title"><h3 class="text-2xl text-white">الأكثر مبيعاً</h3></div>
                <div id="home-products" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
            </div>
        </section>
    </main>
    <div id="app-footer"></div>
    <script src="js/products.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadGlobalLayout();
            const grid = document.getElementById('home-products');
            grid.innerHTML = products.slice(0, 4).map(buildProductCard).join('');
        });
    </script>
</body>
</html>
